 .arrow-container {

    color: #3c5a1c;

  /* САКУРА / ЛЕПЕСТКИ */
  .sakura {
    pointer-events: none;
    position: fixed;
  }

  @-webkit-keyframes fall { 0% { opacity: 0.9; top: 0; } 100% { opacity: 0.2; top: 100%; } }
  @keyframes fall { 0% { opacity: 0.9; top: 0; } 100% { opacity: 0.2; top: 100%; } }
  @-webkit-keyframes blow-soft-left { 0% { margin-left: 0; } 100% { margin-left: -50%; } }
  @keyframes blow-soft-left { 0% { margin-left: 0; } 100% { margin-left: -50%; } }
  @-webkit-keyframes blow-medium-left { 0% { margin-left: 0; } 100% { margin-left: -100%; } }
  @keyframes blow-medium-left { 0% { margin-left: 0; } 100% { margin-left: -100%; } }
  @-webkit-keyframes blow-soft-right { 0% { margin-left: 0; } 100% { margin-left: 50%; } }
  @keyframes blow-soft-right { 0% { margin-left: 0; } 100% { margin-left: 50%; } }
  @-webkit-keyframes blow-medium-right { 0% { margin-left: 0; } 100% { margin-left: 100%; } }
  @keyframes blow-medium-right { 0% { margin-left: 0; } 100% { margin-left: 100%; } }
  @-webkit-keyframes sway-0 { 0% { -webkit-transform: rotate(-5deg); transform: rotate(-5deg); } 40% { -webkit-transform: rotate(28deg); transform: rotate(28deg); } 100% { -webkit-transform: rotate(3deg); transform: rotate(3deg); } }
  @keyframes sway-0 { 0% { transform: rotate(-5deg); } 40% { transform: rotate(28deg); } 100% { transform: rotate(3deg); } }
  @-webkit-keyframes sway-1 { 0% { transform: rotate(10deg); } 40% { transform: rotate(43deg); } 100% { transform: rotate(15deg); } }
  @keyframes sway-1 { 0% { transform: rotate(10deg); } 40% { transform: rotate(43deg); } 100% { transform: rotate(15deg); } }
  @-webkit-keyframes sway-2 { 0% { transform: rotate(15deg); } 40% { transform: rotate(56deg); } 100% { transform: rotate(22deg); } }
  @keyframes sway-2 { 0% { transform: rotate(15deg); } 40% { transform: rotate(56deg); } 100% { transform: rotate(22deg); } }
  @-webkit-keyframes sway-3 { 0% { transform: rotate(25deg); } 40% { transform: rotate(74deg); } 100% { transform: rotate(37deg); } }
  @keyframes sway-3 { 0% { transform: rotate(25deg); } 40% { transform: rotate(74deg); } 100% { transform: rotate(37deg); } }
  @-webkit-keyframes sway-4 { 0% { transform: rotate(40deg); } 40% { transform: rotate(68deg); } 100% { transform: rotate(25deg); } }
  @keyframes sway-4 { 0% { transform: rotate(40deg); } 40% { transform: rotate(68deg); } 100% { transform: rotate(25deg); } }
  @-webkit-keyframes sway-5 { 0% { transform: rotate(50deg); } 40% { transform: rotate(78deg); } 100% { transform: rotate(40deg); } }

  @-webkit-keyframes sway-8 { 0% { transform: rotate(94deg); } 40% { transform: rotate(136deg); } 100% { transform: rotate(82deg); } }
  @keyframes sway-8 { 0% { transform: rotate(94deg); } 40% { transform: rotate(136deg); } 100% { transform: rotate(82deg); } }
</style>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const modal = document.getElementById('musicModal');
    const playBtn = document.getElementById('playMusicBtn');
    const audio = document.getElementById('backgroundMusic');

    function openInvitation() {
      audio.play().catch(function (err) {
        console.warn('Не удалось запустить музыку:', err);
      });

      modal.classList.add('hidden');
      setTimeout(function () {
        modal.style.display = 'none';
      }, 500);

      document.body.classList.remove('modal-open');

      document.querySelectorAll('.element-animation').forEach(function (el) {
        el.classList.add('element-show');
      });
    }

    playBtn.addEventListener('click', openInvitation);

    // Фотолардың бірте-бірте пайда болуы
    const observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('element-show');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });
    document.querySelectorAll('.element-animation').forEach(function (el) {
      observer.observe(el);
    });

    // ТАЙМЕР
    function updateCountdown() {
      const endDate = new Date("October 11, 2026 19:00:00").getTime();
      const now = Date.now();
      const distance = endDate - now;

      if (distance < 0) {
        document.getElementById("days").textContent = "00";
        document.getElementById("hours").textContent = "00";
        document.getElementById("minutes").textContent = "00";
        document.getElementById("seconds").textContent = "00";
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById("days").textContent = String(days).padStart(2, '0');
      document.getElementById("hours").textContent = String(hours).padStart(2, '0');
      document.getElementById("minutes").textContent = String(minutes).padStart(2, '0');
      document.getElementById("seconds").textContent = String(seconds).padStart(2, '0');
    }
    updateCountdown();
    setInterval(updateCountdown, 1000);

    // СЧЁТЧИК КОЛИЧЕСТВА
    let count = 1;
    const peopleCountEl = document.getElementById('peopleCount');
    const choiceHiddenEl = document.getElementById('choiceHidden');
    document.getElementById('decrease').addEventListener('click', function () {
      if (count > 1) {
        count--;
        peopleCountEl.textContent = count;
        choiceHiddenEl.value = count;
      }
    });
    document.getElementById('increase').addEventListener('click', function () {
      count++;
      peopleCountEl.textContent = count;
      choiceHiddenEl.value = count;
    });

    // ФОРМА
    const URL_APP = "https://script.google.com/macros/s/AKfycbzFsAUv0XlBeC8jC6sH7SxcuYD9MtQ22d7frMQSeXuCJgRk_7RQW67z2h5Be_TydvoDiw/exec";
    const form = document.querySelector("#form");

    form.addEventListener("submit", async function (ev) {
      ev.preventDefault();

      const message = document.querySelector("[name=message]");
      const attend = document.querySelector("[name=attend]:checked");
      const choice = document.querySelector("[name=choice]");

      const details = {
        name: message.value.trim(),
        attend: attend ? attend.value : '',
        choice: choice ? choice.value : '',
      };

      let formBody = [];
      for (const property in details) {
        formBody.push(encodeURIComponent(property) + "=" + encodeURIComponent(details[property]));
      }
      formBody = formBody.join("&");

      fetch(URL_APP, {
       method: "POST",
       headers: { "Content-Type": "application/json" },
       mode: "no-cors", // или "cors", если настроен CORS
       body: JSON.stringify(details)
      });

      if (attend) attend.checked = false;
      message.value = '';
      count = 1;
      peopleCountEl.textContent = count;
      choiceHiddenEl.value = count;
      alert('Жауабыңызға рахмет!');
    });
  });
</script>

<script>
"use strict";
var Sakura = function Sakura(selector, options) {
  var _this = this;
  if (typeof selector === 'undefined') { throw new Error('No selector present. Define an element.'); }
  this.el = document.querySelector(selector);
  var defaults = {
    className: 'sakura',
    fallSpeed: 1,
    maxSize: 14,
    minSize: 10,
    delay: 300,
    colors: [{
      gradientColorStart: 'rgba(60, 90, 28, 0.85)',
      gradientColorEnd: 'rgba(111, 138, 83, 0.85)',
      gradientColorDegree: 120
    }]
  };
  var extend = function extend(originalObj, newObj) {
    Object.keys(originalObj).forEach(function (key) {
      if (newObj && Object.prototype.hasOwnProperty.call(newObj, key)) {
        originalObj[key] = newObj[key];
      }
    });
    return originalObj;
  };
  this.settings = extend(defaults, options);
  this.el.style.overflowX = 'hidden';

  function randomArrayElem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function randomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

  var prefixes = ['webkit', 'moz', 'MS', 'o', ''];
  function PrefixedEvent(element, type, callback) {
    for (var p = 0; p < prefixes.length; p += 1) {
      var animType = type;
      if (!prefixes[p]) { animType = type.toLowerCase(); }
      element.addEventListener(prefixes[p] + animType, callback, false);
    }
  }

  function elementInViewport(el) {
    var rect = el.getBoundingClientRect();
    return rect.top >= 0 && rect.left >= 0 &&
      rect.bottom <= (window.innerHeight || document.documentElement.clientHeight) &&
      rect.right <= (window.innerWidth || document.documentElement.clientWidth);
  }

  this.createPetal = function () {
    if (_this.el.dataset.sakuraAnimId) {
      setTimeout(function () { window.requestAnimationFrame(_this.createPetal); }, _this.settings.delay);
    }
    var animationNames = {
      blowAnimations: ['blow-soft-left', 'blow-medium-left', 'blow-soft-right', 'blow-medium-right'],
      swayAnimations: ['sway-0', 'sway-1', 'sway-2', 'sway-3', 'sway-4', 'sway-5', 'sway-6', 'sway-7', 'sway-8']
    };
    var blowAnimation = randomArrayElem(animationNames.blowAnimations);
    var swayAnimation = randomArrayElem(animationNames.swayAnimations);
    var fallTime = (document.documentElement.clientHeight * 0.007 + Math.round(Math.random() * 5)) * _this.settings.fallSpeed;
    var animationsArr = [
      "fall " + fallTime + "s linear 0s 1",
      blowAnimation + " " + ((fallTime > 30 ? fallTime : 30) - 20 + randomInt(0, 20)) + "s linear 0s infinite",
      swayAnimation + " " + randomInt(2, 4) + "s linear 0s infinite"
    ];
    var animations = animationsArr.join(', ');

    var petal = document.createElement('div');
    petal.classList.add(_this.settings.className);
    var height = randomInt(_this.settings.minSize, _this.settings.maxSize);
    var width = height - Math.floor(randomInt(0, _this.settings.minSize) / 3);
    var color = randomArrayElem(_this.settings.colors);
    petal.style.background = "linear-gradient(" + color.gradientColorDegree + "deg, " + color.gradientColorStart + ", " + color.gradientColorEnd + ")";
    petal.style.webkitAnimation = animations;
    petal.style.animation = animations;
    petal.style.borderRadius = randomInt(_this.settings.maxSize, _this.settings.maxSize + Math.floor(Math.random() * 10)) + "px " + randomInt(1, Math.floor(width / 4)) + "px";
    petal.style.height = height + "px";
    petal.style.left = (Math.random() * document.documentElement.clientWidth - 100) + "px";
    petal.style.marginTop = -(Math.floor(Math.random() * 20) + 15) + "px";
    petal.style.width = width + "px";

    PrefixedEvent(petal, 'AnimationEnd', function () { if (!elementInViewport(petal)) { petal.remove(); } });
    PrefixedEvent(petal, 'AnimationIteration', function () { if (!elementInViewport(petal)) { petal.remove(); } });

    _this.el.appendChild(petal);
  };

  this.el.setAttribute('data-sakura-anim-id', window.requestAnimationFrame(this.createPetal));
};

document.addEventListener('DOMContentLoaded', function () {
  new Sakura('body', { delay: 50 });
});
</script>
